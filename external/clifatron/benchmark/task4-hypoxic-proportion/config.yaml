# Benchmark Configuration for Task 4: Hypoxic Respiratory Failure Proportion
# Regression task: Predict proportion of time in severe hypoxic failure during hours 24-72

# Paths
paths:
  # Root directory for CLIFATRON project
  root_dir: "/home/vchaudha/CLIFATRON"

  # Output tokens directory (from clif_config.json)
  output_tokens: "/home/vchaudha/CLIFATRON/OutputTokens"

  # Narrative sequences
  narratives_dir: "/home/vchaudha/CLIFATRON/OutputTokens/narratives"
  train_val_sequences: "/home/vchaudha/CLIFATRON/OutputTokens/narratives/train_val_sequences.parquet"
  test_sequences: "/home/vchaudha/CLIFATRON/OutputTokens/narratives/test_sequences.parquet"

  # Benchmark data directory
  benchmark_data: "/home/vchaudha/CLIFATRON/benchmark/data"

  # Results directory
  results_dir: "/home/vchaudha/CLIFATRON/benchmark/results/task4-hypoxic-proportion"

  # Model checkpoints
  model_checkpoints:
    gpt2: "/home/vchaudha/CLIFATRON/models/gpt2/checkpoints"
    gpt2_hf: "/home/vchaudha/CLIFATRON/models/gpt2_hf/checkpoints"
    qwen2: "/home/vchaudha/CLIFATRON/models/qwen2/checkpoints"

# Task Configuration
task:
  name: "task4-hypoxic-proportion"
  description: "Regression: Predict proportion of time in severe hypoxic respiratory failure (PEEP>8 OR FiO2>50%) during hours 24-72"

  # Task 4 uses task4_proportion column from data
  task_type: "regression"

  # Target variable
  target: "task4_proportion"  # Continuous value from 0.0 to 1.0

  # Cohort: Only IMV patients from first 24hr of ICU
  cohort: "IMV patients in first 24hr of ICU"

# Model Configuration
models:
  available_models:
    - "gpt2"
    - "gpt2_hf"
    - "qwen2"

  # Vocabulary settings
  vocab_file: "/home/vchaudha/CLIFATRON/AR/gpt2_hf/tokenizer/clinical_tokenizer/vocab.json"
  vocab_size: 1373

  # Model sizes to benchmark
  model_sizes:
    gpt2_hf: ["small", "medium"]
    qwen2: ["small"]
    gpt2: ["custom"]

# Method 1: Embedding-based Regression with XGBoost/Ridge
method1_embedding:
  # Which layer to extract embeddings from
  embedding_layer: "mean"  # Options: "last", "mean"

  # Regressor options
  regressor:
    type: "xgboost"  # Options: "xgboost", "ridge", "lasso"

    # XGBoost parameters (for regression)
    xgboost:
      max_depth: 6
      learning_rate: 0.1
      n_estimators: 100
      objective: "reg:squarederror"  # Regression objective
      eval_metric: "rmse"
      verbose: false

    # Ridge regression parameters
    ridge:
      alpha: 1.0
      max_iter: 1000
      solver: "auto"

    # Lasso regression parameters
    lasso:
      alpha: 1.0
      max_iter: 1000

  # Batch size for embedding extraction
  batch_size: 16
  max_length: 8192

# Method 2: Monte Carlo Sampling with Sliding Window (Future Work)
method2_montecarlo:
  # Number of trajectory samples per sequence
  num_samples: 100

  # Sliding window generation parameters
  max_new_tokens: 8192  # Maximum tokens to generate per trajectory
  sliding_window_step: 512  # Tokens to remove from start when sliding

  # Sampling strategies
  sampling_strategies:
    - name: "temperature"
      temperature: [0.7, 1.0, 1.3]
    - name: "top_k"
      top_k: [10, 50, 100]
    - name: "nucleus"
      top_p: [0.9, 0.95, 0.99]

  # Aggregation method for regression
  aggregation: "mean"  # Options: "mean", "median"

# Evaluation Metrics
metrics:
  compute:
    - "mse"         # Mean Squared Error
    - "mae"         # Mean Absolute Error
    - "rmse"        # Root Mean Squared Error
    - "r2"          # R-squared score
    - "spearman"    # Spearman correlation
    - "pearson"     # Pearson correlation

  # Additional analysis
  save_predictions: true
  save_scatter_plot: true
  save_residual_plot: true

# Computing Resources
compute:
  device: "auto"  # Options: "auto", "cuda", "cpu"
  mixed_precision: true
  num_workers: 4

  # Distributed computing (automatically detected)
  # Set RANK, WORLD_SIZE, LOCAL_RANK environment variables for multi-GPU/multi-node
  distributed:
    # Backend for distributed training
    backend: "nccl"  # Options: "nccl" (GPU), "gloo" (CPU/GPU)

    # Whether to use DistributedDataParallel for model
    use_ddp: true

    # CPU fallback on GPU OOM
    fallback_cpu: true

# Logging
logging:
  level: "INFO"
  save_logs: true
  log_file: "benchmark.log"

  # WandB integration (optional)
  use_wandb: false
  wandb_project: "clifatron-benchmark"
  wandb_entity: null

# Data Processing
data:
  # Test set ratio (if splitting train_val further)
  test_size: 0.2

  # Random seed for reproducibility
  random_seed: 42

  # Minimum sequence length
  min_sequence_length: 10

  # Maximum sequence length
  max_sequence_length: 8192

  # 24-hour ICU truncation (input is first 24hr, label is from hours 24-72)
  truncate_at_24hr_icu: true

  # Data normalization (for regression targets)
  normalize_target: false  # task4_proportion already in [0, 1]

# Output Format
output:
  format: "json"  # Options: "json", "csv", "both"
  include_metadata: true
  timestamp_results: true
