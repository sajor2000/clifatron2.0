# Benchmark Configuration for Task 2: Discharged to LTACH Prediction
# Binary classification task: Predict whether a patient will be discharged to LTACH

# Paths
paths:
  # Root directory for CLIFATRON project
  root_dir: "/home/vchaudha/CLIFATRON"

  # Output tokens directory (from clif_config.json)
  output_tokens: "/home/vchaudha/CLIFATRON/OutputTokens"

  # Narrative sequences
  narratives_dir: "/home/vchaudha/CLIFATRON/OutputTokens/narratives"
  train_val_sequences: "/home/vchaudha/CLIFATRON/OutputTokens/narratives/train_val_sequences.parquet"
  test_sequences: "/home/vchaudha/CLIFATRON/OutputTokens/narratives/test_sequences.parquet"

  # Benchmark data directory
  benchmark_data: "/home/vchaudha/CLIFATRON/benchmark/data/task2-discharged-ltach"

  # Results directory
  results_dir: "/home/vchaudha/CLIFATRON/benchmark/results/task2-discharged-ltach"

  # Model checkpoints
  model_checkpoints:
    gpt2: "/home/vchaudha/CLIFATRON/models/gpt2/checkpoints"
    gpt2_hf: "/home/vchaudha/CLIFATRON/models/gpt2_hf/checkpoints"
    qwen2: "/home/vchaudha/CLIFATRON/models/qwen2/checkpoints"

# Task Configuration
task:
  name: "task2-discharged-ltach"
  description: "Binary classification: Predict if patient will be discharged to LTACH (Long-Term Acute Care Hospital)"

  # Target disposition
  positive_class: "disposition_ltach"

  # All disposition tokens for filtering
  disposition_tokens:
    - "disposition_home"
    - "disposition_expired"
    - "disposition_rehab"
    - "disposition_snf"
    - "disposition_hospice"
    - "disposition_ltach"
    - "disposition_other"

# Model Configuration
models:
  available_models:
    - "gpt2"
    - "gpt2_hf"
    - "qwen2"

  # Vocabulary settings
  vocab_file: "/home/vchaudha/CLIFATRON/AR/gpt2_hf/tokenizer/clinical_tokenizer/vocab.json"
  vocab_size: 1373

  # Model sizes to benchmark
  model_sizes:
    gpt2_hf: ["small", "medium"]
    qwen2: ["small"]
    gpt2: ["custom"]

# Method 1: Embedding-based Classification with XGBoost
method1_embedding:
  # Which layer to extract embeddings from
  embedding_layer: "mean"  # Options: "last", "mean"

  # Classifier options
  classifier:
    type: "xgboost"  # Options: "xgboost", "logistic_regression"

    # XGBoost parameters (default classifier)
    xgboost:
      max_depth: 6
      learning_rate: 0.1
      n_estimators: 100
      verbose: false

    # Logistic regression parameters
    logistic_regression:
      max_iter: 1000
      C: 1.0
      solver: "lbfgs"

  # Batch size for embedding extraction
  batch_size: 16
  max_length: 8192

# Method 2: Monte Carlo Sampling with Sliding Window
method2_montecarlo:
  # Number of trajectory samples per sequence
  num_samples: 100

  # Sliding window generation parameters
  max_new_tokens: 8192  # Maximum tokens to generate per trajectory
  sliding_window_step: 512  # Tokens to remove from start when sliding

  # Sampling strategies
  sampling_strategies:
    - name: "temperature"
      temperature: [0.7, 1.0, 1.3]
    - name: "top_k"
      top_k: [10, 50, 100]
    - name: "nucleus"
      top_p: [0.9, 0.95, 0.99]

  # Aggregation method
  aggregation: "majority_vote"  # Options: "majority_vote", "probability_threshold"
  probability_threshold: 0.5

# Evaluation Metrics
metrics:
  compute:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auroc"
    - "auprc"
    - "confusion_matrix"

  # Additional analysis
  save_predictions: true
  save_confusion_matrix: true

# Computing Resources
compute:
  device: "auto"  # Options: "auto", "cuda", "cpu"
  mixed_precision: true
  num_workers: 4

  # Distributed computing (automatically detected)
  # Set RANK, WORLD_SIZE, LOCAL_RANK environment variables for multi-GPU/multi-node
  distributed:
    # Backend for distributed training
    backend: "nccl"  # Options: "nccl" (GPU), "gloo" (CPU/GPU)

    # Whether to use DistributedDataParallel for model
    use_ddp: true

    # CPU fallback on GPU OOM
    fallback_cpu: true

# Logging
logging:
  level: "INFO"
  save_logs: true
  log_file: "benchmark.log"

  # WandB integration (optional)
  use_wandb: false
  wandb_project: "clifatron-benchmark"
  wandb_entity: null

# Data Processing
data:
  # Test set ratio (if splitting train_val further)
  test_size: 0.2

  # Random seed for reproducibility
  random_seed: 42

  # Minimum sequence length
  min_sequence_length: 10

  # Maximum sequence length
  max_sequence_length: 8192

  # 24-hour ICU truncation
  truncate_at_24hr_icu: true  # Truncate sequences to only include first 24 hours of ICU

  # Whether to balance classes
  balance_classes: false

# Output Format
output:
  format: "json"  # Options: "json", "csv", "both"
  include_metadata: true
  timestamp_results: true
