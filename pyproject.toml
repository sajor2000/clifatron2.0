[project]
name = "clif-foundation-model"
version = "0.1.0"
description = "Compact multimodal foundation model for critical care on federated CLIF 2.1"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",            # bf16 + torch.compile on L40 (Ada)
    "duckdb>=1.1",           # read CLIF parquet without loading to memory
    "polars>=1.0",           # fast melt / pivot
    "pyarrow>=17",
    "numpy>=1.26",
    "pyyaml>=6",
    "scikit-learn>=1.5",     # AUROC/AUPRC, calibration, isotonic (ICI)
    "lightgbm>=4.5",         # LPE baseline (task-specific ML floor)
    "xgboost>=2.1",          # CLIFATRON Method 1 baseline (XGBoost-on-embeddings)
    "transformers>=4.44",    # load CLIFATRON GPT2/Qwen2 checkpoints (head_adapter)
    "sentence-transformers>=3.0",  # leakage-safe note embeddings (small clinical model)
    "tqdm>=4.66",
    "cryptography>=44.0.1",    # U11 Ed25519 releaser->site bundle signing (trust.py)
]

# Test runner, grouped for reproducible CI installs (`uv run --frozen --group dev pytest`).
# cryptography is already a runtime dependency above, so the data-free suites need only
# the test runner added here.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.8.0",
]

[tool.uv]
# One NCCL on Linux: torch (CUDA 13 build from PyPI) ships nvidia-nccl-cu13, while older
# xgboost releases (3.2.x, picked under Python 3.11) pull nvidia-nccl-cu12; both wheels
# write nvidia/nccl/lib/libnccl.so.2, so whichever installs last silently replaces the
# library torch's DDP loads. xgboost is only used on CPU here (src/eval/method3.py, no
# `device=` argument) and loads NCCL lazily for multi-GPU training only, so the cu12 wheel
# is dropped everywhere (a never-true marker). The pre-flight prints torch.cuda.nccl.version().
# Attention is torch SDPA (flash / memory-efficient kernels; src/model/encoder.py); no
# flash-attn or xformers dependency. torch resolves from PyPI (the CUDA 13 build on Linux,
# needs NVIDIA driver >= 580): the cu126 fallback for an older driver is documented in
# docs/plans/l40-runbook.md ("CUDA build and driver"), not applied here.
override-dependencies = [
    "nvidia-nccl-cu12; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
