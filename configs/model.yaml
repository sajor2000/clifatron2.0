# ~30M-param Qwen2/Llama-style trunk. REVISED 2026-08-27 per notes/RESEARCH.md §2-§3
# + the two 2026-preprint research threads (tokenization a76bb9, architecture aeb4d2).
# Flat causal decoder over FUSED code=value tokens with TIME-AWARE admission-relative RoPE
# (Lee 2026 arXiv:2604.16775; Context Clues 2412.16178; RAVEN 2603.24562; HealthFormer 2026).
#
# Backbone verdict (arch thread): KEEP transformer, do NOT switch to Mamba — at 8k/30M Mamba is
# within noise and the objective (not the backbone) drives EHR performance (ORA 2602.00541).
# Mamba/HyMaTE hybrid = stretch ablation only. We also attach to CLIFATRON's Qwen2 checkpoint.

trunk:
  d_model: 512
  n_layers: 8              # 8 x 512 x 8 heads, SwiGLU+RMSNorm+RoPE ~= 25M trunk (+ emb below)
  n_heads: 8
  ffn_mult: 4              # SwiGLU hidden = ffn_mult * d_model
  dropout: 0.1
  max_tokens: 8192         # match CLIFATRON trunk (we attach to it); 4096 = Lee-tokenizer ablation arm
  # TIME-AWARE RoPE (single highest-leverage arch change per aeb4d2): rotate by admission-relative
  # MINUTES, shared across tokens within one event (same timestamp -> same position). Not token index.
  # Pre-training config decision (2026-10-03; docs/decisions/2026-10-03-clinical-decisions.md).
  # Positions are MINUTES since admission. build_rope_cache uses inv_freq_i = base^(-i/half)
  # (i = 0..half-1, half = head_dim/2 = 32), so the slowest wavelength is
  # 2*pi*base^(31/32): base 1e4 -> ~47,000 min (~33 days), shorter than long stays
  # (66+ days; ~100,000 min), so far-apart minutes alias in the slowest dimension.
  # base 1e5 -> ~438,000 min (~305 days, ~4x the longest stay) while the fastest dimension
  # stays 1 rad/min (short-range resolution is set by i = 0, independent of the base); the
  # per-dimension frequency ratio grows only from 1.33 to 1.43. 5e5 would push the slowest
  # wavelength to ~4 years, spending dimensions on spans no stay reaches.
  rope_base: 100000.0
  # Re-insert the stay's header (<bos>, ADMISSION//, static tokens) before every
  # continuation window (src/data/dataset.py). Tokenization cuts NEW GEM shards with room for
  # the header (dataset.gem_window_bounds_with_header) and records the cut mode
  # (`continuation_header`, `header_length`) in every row's artifact_hashes and in the
  # GemCorpus cache key. Training refuses a shard cut the other way (e.g. a shard
  # tokenized before this flag, or with it off): re-tokenize the shard, then train.
  continuation_header: true
  rope_position: "admission_minutes"   # {admission_minutes | token_index(ablation)}
  rope_time_alibi: false               # optional log-Δt ALiBi bias for severe irregular sampling (HealthFormer)
  # UNVERIFIED (2026-10-03, notes/ai-novelty-audit.md §6): an earlier comment here said untied
  # embeddings beat tied by +4-7% AUPRC, with the gap widening under federation, and cited
  # medRxiv 2026.04.24.26351503. The retrieved paper is an LLM-vs-clinical-foundation-model
  # comparison and the claim could not be confirmed there. Untied stays the locked choice
  # (MEMORY.md §E1); the size of any gain is unmeasured.
  # BUDGET TENSION: untied + large vocab blows the ~30M budget. At untied, vocab*d*2 lives in the
  # embedding tables — so cap fused vocab ~8-12k (untied => ~8-12M emb + ~25M trunk ~= 33-37M).
  # A ~30k vocab would force tied. Chosen: untied + ~10k vocab.
  # tied_embeddings: false means UNTIED (separate input + output weight matrices).
  tied_embeddings: false
  target_vocab: 10000       # budget cap; actual fused vocab (clinical segments) is a few hundred ids — see data-tokenization

heads:
  # (A) next-event token — LOW weight auxiliary (weakest learner alone; kept for
  #     open-ended zero-shot via SCOPE/REACH rollout). RESEARCH.md §3.
  next_event: {enabled: true, weight: 0.2}
  # (B) competing-risk time-to-event CIF — SurvivEHR
  competing_risk: {enabled: true, weight: 1.0, n_time_bins: 16, horizon_hours: 48}
  # (C) threshold-conditioned hazard — ICareFM (PRIMARY zero-shot engine)
  threshold_hazard:
    enabled: true
    weight: 1.0
    horizon_hours: 48
    n_time_bins: 48                 # hourly discrete hazard over 48h
    # How in-stream training thresholds are drawn (src/data/threshold_grid.py; an unknown
    # value is refused): empirical_bins = uniformly from each target concept's own frozen
    # bin edges under the arm's vocabulary. Evaluation uses configs/thresholds.yaml.
    tau_sampling: "empirical_bins"
    direction_embed: true           # learned direction (above/below) embedding
    threshold_embed_dim: 32         # learned threshold embedding
  # (D) value regression — the ORA "mark" (arXiv:2602.00541). NOW ENABLED:
  #     ORA reports marked time-to-event beating NTP by 10.7% (Transformer) and 11.4% (Mamba)
  #     on average over 14 tasks. (Corrected 2026-10-03: the earlier "+33-38% vs NTP" here did
  #     not match the source — notes/ai-novelty-audit.md §6.)
  value_regression: {enabled: true, weight: 0.5}

# In-stream time-to-event supervision on the full-hospitalization representation (KTD1):
# anchors are sampled per (seed, epoch, stay) in every context window and labelled from
# the stay's own future. The label rule (horizon, lookback, ascertainment window) and the
# competing-risk cause thresholds live in configs/thresholds.yaml.
in_stream:
  anchors_per_window: 8      # each carries one competing-risk label
  queries_per_anchor: 4      # threshold-hazard queries per anchor (tau_sampling above)

# Loss balancing is FIXED weights: the objective is the sum of the heads' losses times the
# heads.*.weight above. `fixed` is the only value; anything else is refused at config load
# (an `uncertainty` option sat here for months and was never implemented).
loss_balancing: "fixed"
# ntp_then_tte | none. ntp_then_tte (src/train/curriculum.py): the first 15% of the planned
# optimizer updates train next-event only, the next 5% blend linearly to the weights above,
# the rest use them. `none` uses them from the first update. configs/objective_arms.yaml
# names the objective variants; `pretrain --objective-arm <name>` selects one.
curriculum: "ntp_then_tte"

precision: "bf16"
compile: true
