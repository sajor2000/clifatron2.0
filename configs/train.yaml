# 2x L40 (48 GB each, Ada, no NVLink). DDP via torchrun --nproc_per_node=2.
optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

schedule:
  warmup_steps: 2000
  total_steps: 60000
  cosine_decay: true

batch:
  per_gpu: 128          # 2 GPUs -> global 256 sequences x 512 events
  grad_accum: 1

runtime:
  precision: bf16
  compile: true
  ddp: true
  num_workers: 8
  ckpt_every: 2000
  ckpt_dir: "checkpoints"
  # trunk saved separately from heads so probes/finetune reuse it

data_contract:
  cohort: "configs/cohort.yaml"
  artifact_policy: "configs/artifact_policy.yaml"
  split_seed: 42
  partitions:
    train: 0.60
    validation: 0.15
    calibration: 0.10
    internal_test: 0.15
  required_partitions: [train, validation, calibration, internal_test]
  artifact_fit_partition: train
  sealed_partitions: [internal_test, external_confirmation]
  sealed_access_log: "output/intermediate_phi/sealed_access.parquet"
  role_permissions:
    train: [fit_model, fit_vocabulary, fit_numeric_edges, fit_target_map]
    validation: [model_selection]
    calibration: [fit_calibration]
    internal_test: [final_evaluation_once_frozen]
    transport: [development_site_evaluation]
    external_confirmation: [confirmation_once_frozen]
  site_roles:
    development: [mimic, rush, uchicago]
    external_confirmation: []
  compatibility_families: [clifatron_checkpoint, experimental_representation]

finetune:
  freeze_trunk: true
  tasks:                # K supervised task heads (all CLIF-derivable)
    - map_below_65_48h
    - lactate_above_4_48h
    - spo2_below_88_48h
  zero_shot_holdout: []
  lr: 1.0e-3
  epochs: 20

eval:
  sites: [mimic, rush]
  ensemble: mean        # inference-time ensembling (Elemento)
  calibration: temperature_scaling   # Cadence
  slices: [sex_category, race_category]   # TRIPOD+AI dual-sex + race
  size_ablation: [10_000_000, 30_000_000, 100_000_000]  # params, small-beats-big
