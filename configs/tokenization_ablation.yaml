# Tokenization ablation design (NEXT_STEPS.md §4) — run by src/train/run_tokenization_ablation.py.
# STATUS 2026-10-02 (U6): RUNNABLE. Each arm loads its OWN events shard + frozen vocab.json through
# pretrain.build_loaders and trains through pretrain.Model / engine.train with masked losses and the
# configs/model.yaml heads.*.weight objective weights. Only the input representation varies.
# Primary scheme is physician clinical segments + soft discretization (MEMORY.md §E1a, revised
# 2026-09-02); see website/docs/data-tokenization.md §9.
# Evidence: Lee 2026 (arxiv:2604.16775) — soft discretization helped on selected tail outcomes
# as a point estimate, in UNFUSED arms only (fused + soft was not tested); McCann 2026
# (medRxiv 2026.08.04) — continuous-fused better numeric, worse calibration;
# Al Attrach 2025 (arxiv:2512.05217) — frozen text encoders beat trainable.
#
# Arm keys:
#   scheme      configs/data.yaml value_binning.scheme the arm's vocabulary was built with
#               (clinical_segment | decile_ablation); checked against the vocab's binning sources.
#   tokenizer   fused | continuous_fused | textcode (the input representation).
#   soft_discretization  true -> soft [T,K] bins (the shard must be tokenized with soft on);
#               false -> hard ids. Hard and soft arms of one scheme share one shard.
#   events / vocab / value_stats  per-arm artifacts (override with --events/--vocab/--value-stats).
#     clinical:   python -m src.data.tokenize ... (scheme clinical_segment, soft on)
#                 + outcome_join + value_stats
#     deciles:    the same with scheme decile_ablation
#     continuous: python -m src.data.tokenize_continuous --primary-vocab <clinical>/vocab.json
#                 --primary-events <clinical>/events_with_outcomes.parquet --out <continuous dir>
#                 (edgeless concept ids; threshold bins + n_value_bins from the primary segments)
#                 + value_stats on the derived shard
# Batch size, grad accumulation, warmup and runtime come from configs/train.yaml (shared by
# every arm, so only tokenization varies).

# ------------------------------------------------------------------- shared
shared:
  # Outcomes from configs/cohort.yaml (the frozen contract); nothing outside it.
  outcomes:
    - map_below_65_48h
    - lactate_above_4_48h
    - spo2_below_88_48h
  zero_shot_outcomes: []
  n_folds: 5
  seed_base: 42
  metrics: [auroc, auprc, ece, brier, calib_slope, calib_intercept, ici]
  calibration: temperature_scaling
  # Same CLIFEncoder trunk architecture for every arm — only tokenization varies.
  trunk: clif_encoder
  # freeze_trunk freezes the transformer blocks ONLY with an init_checkpoint bound to the arm's
  # vocabulary (--init-checkpoint); without one the runner warns and keeps the trunk trainable
  # (a frozen random trunk trains the heads on noise). Arms train from scratch by default.
  freeze_trunk: false
  init_checkpoint: null
  curriculum: ntp_then_tte

# --------------------------------------------------------------------- arms
arms:
  # (1) PRIMARY — physician clinical-segment bins + soft discretization (configs/data.yaml default).
  # Bins from external/clifatron/tokenETL/config/critical_illness_tokenization_final_with_intervals.csv
  clinical_soft:
    description: "Physician clinical-segment bins + soft discretization (primary)"
    primary: true
    scheme: clinical_segment
    tokenizer: fused
    soft_discretization: true
    events: output/intermediate_phi/mimic/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic/vocab.json
    value_stats: output/intermediate_phi/mimic/value_stats.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, primary, clinical-bins, soft-discretization]

  # (2) Clinical-segment bins, hard ids (the CLIFATRON baseline). Same shard as the primary arm.
  clinical_hard:
    description: "Physician clinical-segment bins, hard tokens (CLIFATRON baseline)"
    scheme: clinical_segment
    tokenizer: fused
    soft_discretization: false
    events: output/intermediate_phi/mimic/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic/vocab.json
    value_stats: output/intermediate_phi/mimic/value_stats.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, baseline, clinical-bins]

  # (3) Global deciles only — Lee's simplest winner. Per-concept population deciles, frozen from
  # the reference site (data.yaml scheme: decile_ablation), hard ids.
  global_deciles:
    description: "Per-concept population deciles, frozen from reference site"
    scheme: decile_ablation
    tokenizer: fused
    soft_discretization: false
    events: output/intermediate_phi/mimic_decile/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic_decile/vocab.json
    value_stats: output/intermediate_phi/mimic_decile/value_stats.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, decile, lee-2026]

  # (4) Deciles + soft discretization. Same shard as (3).
  # Lee 2026: ahead on selected tail outcomes (severe hypokalemia / hypernatremia / hypotension /
  # CRRT / K-extremes) as a point estimate, from unfused arms only — not a tested result for
  # fused tokens. (Corrected 2026-10-03 from "Lee's best encoder on dangerous tails. Wins on ...";
  # notes/ai-novelty-audit.md §6.)
  deciles_plus_soft:
    description: "Deciles with soft discretization (kernel=1) + forced clinical edges"
    scheme: decile_ablation
    tokenizer: fused
    soft_discretization: true
    events: output/intermediate_phi/mimic_decile/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic_decile/vocab.json
    value_stats: output/intermediate_phi/mimic_decile/value_stats.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, decile, soft-discretization, lee-2026]

  # (5) Continuous-fused — McCann 2026. Edgeless concept ids + normalized current-value channel,
  # derived from the primary clinical shard; threshold bins / n_value_bins from the primary segments.
  #   +30% numeric accuracy, −34% seq length, worse calibration.
  # Hypothesis: loses on calibration metrics, wins on regression outcomes.
  continuous_fused:
    description: "Continuous-fused value channel (McCann 2026) — ablation"
    scheme: clinical_segment
    tokenizer: continuous_fused
    soft_discretization: false
    events: output/intermediate_phi/mimic_continuous/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic_continuous/vocab.json
    value_stats: output/intermediate_phi/mimic_continuous/value_stats.json
    primary_vocab: output/intermediate_phi/mimic/vocab.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, continuous-fused, mccann-2026, ablation]

  # (6) TextCode — frozen BioClinical-ModernBERT embeddings of a generated description of every
  # fused id (concept, source table, bin interval, unit) + a trainable projection. Primary shard,
  # hard ids. Al Attrach 2025: frozen > trainable, 10+ AUROC gap, 15× fewer trainable params.
  # Hypothesis: competitive on all tasks but worse than fused on rare concepts.
  textcode:
    description: "Frozen BioClinical-ModernBERT code-description embeddings (TextCode)"
    scheme: clinical_segment
    tokenizer: textcode
    textcode_encoder: "thomas-sounack/BioClinical-ModernBERT-base"   # = data.yaml notes.encoder
    soft_discretization: false
    events: output/intermediate_phi/mimic/events_with_outcomes.parquet
    vocab: output/intermediate_phi/mimic/vocab.json
    value_stats: output/intermediate_phi/mimic/value_stats.json
    lr: 1.0e-3
    total_steps: 20000
    tags: [tokenization, textcode, frozen-encoder, al-attrach-2025]

# ---------------------------------------------------------------- reporting
report:
  output_dir: "results/tokenization_ablation"
  figure_format: [csv, json]
  primary_table:
    orientation: outcome_by_arm
  headroom_figure:
    # the primary arm (clinical + soft) as baseline
    x_axis: outcome
    y_axis: "AUROC gain over clinical-segment + soft bins (primary)"
    series: [clinical_hard, global_deciles, deciles_plus_soft, continuous_fused, textcode]
  calibration_detail:
    note: "Compare ECE, Brier, slope, ICI across arms. McCann predicts continuous-fused loses here."
    metrics: [ece, brier, calib_slope, ici]
  tail_sensitivity:
    # Corrected reading (2026-10-03): Lee's tail result is a point estimate from unfused arms only.
    # The note string below is a config value and is left as written.
    note: "Lee predicts deciles+soft wins dangerous tails (severe hypotension, hyperlactatemia, hypoxemia)."
    outcomes: [map_below_65_48h, lactate_above_4_48h, spo2_below_88_48h]
  evidence_table:
    clinical_soft: "Physician clinical segments + soft discretization (primary; MEMORY.md §E1a)"
    clinical_hard: "CLIFATRON vendor — physician clinical-segment bins, hard"
    global_deciles: "Lee 2026 arxiv:2604.16775 — deciles ≈ clinical at matched granularity"
    # deciles_plus_soft: same correction — point estimate, unfused arms only (value left as written).
    deciles_plus_soft: "Lee 2026 — soft discretization wins dangerous tails"
    continuous_fused: "McCann 2026 medRxiv 2026.08.04 — +30% numeric, worse calibration"
    textcode: "Al Attrach 2025 arxiv:2512.05217 — frozen encoders beat trainable"
