# Local smoke-test schedule (Mac MPS or CPU) — proves the full ETL→train→checkpoint
# loop on real data before the L40 run. NOT a training recipe: 40 optimizer steps,
# tiny effective batch, checkpoint every 20 steps. Real pretrain = configs/train.yaml.
optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0

schedule:
  warmup_steps: 8
  total_steps: 40
  # Run length in passes over the training data (U5). When set, it replaces total_steps:
  # updates = ceil(passes x ceil(batches per pass per rank / grad_accum)).
  passes: null
  cosine_decay: true

batch:
  per_gpu: 2
  grad_accum: 2             # effective batch 4 — smoke only

runtime:
  precision: bf16           # inert on MPS (no cuda); engine autocast is cuda/cpu-scoped
  compile: false
  ddp: false                # single process on the dev box
  num_workers: 0
  log_every: 2
  ckpt_every: 20
  ckpt_dir: "output/intermediate_phi/checkpoints_smoke"

data_contract:
  cohort: "configs/cohort.yaml"
  artifact_policy: "configs/artifact_policy.yaml"
  split_seed: 42
  partitions:
    train: 0.60
    validation: 0.15
    calibration: 0.10
    internal_test: 0.15
  required_partitions: [train, validation, calibration, internal_test]
  artifact_fit_partition: train
  sealed_partitions: [internal_test, external_confirmation]
  sealed_access_log: "output/intermediate_phi/sealed_access.parquet"
  role_permissions:
    train: [fit_model, fit_vocabulary, fit_numeric_edges, fit_target_map]
    validation: [model_selection]
    calibration: [fit_calibration]
    internal_test: [final_evaluation_once_frozen]
    transport: [development_site_evaluation]
    external_confirmation: [confirmation_once_frozen]
  site_roles:
    development: [mimic, rush, uchicago]
    external_confirmation: []
  compatibility_families: [clifatron_checkpoint, experimental_representation]

finetune:
  freeze_trunk: true
  tasks: []
  zero_shot_holdout: []
  lr: 1.0e-3
  epochs: 20

eval:
  sites: [mimic]
  ensemble: mean
  calibration: temperature_scaling
  slices: [sex_category, race_category]
  size_ablation: [10_000_000, 30_000_000, 100_000_000]
