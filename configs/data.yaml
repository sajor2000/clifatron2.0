# CLIF 2.1 tokenizer config. Field names verified 2026-08-27 against:
# https://clif-icu.com/data-dictionary/data-dictionary-2.1.0
# Concepts follow ICareFM's split: measurements are prediction TARGETS,
# treatments are INPUTS ONLY (never targets) -> see notes/METHODS.md rule 1.

schema_version: "2.1.0"
mcide_version: "2.1.0"
cohort_contract: "configs/cohort.yaml"
artifact_policy: "configs/artifact_policy.yaml"
episode_artifact: "output/intermediate_phi/episodes.parquet"

# Every table MUST declare `availability` (R12; tokenize fails closed otherwise):
#   result            - availability_col is when the result became available
#   recorded          - availability_col is when the event was charted/administered
#   missing_storetime - CLIF carries no store time; recorded_dttm stands in
# `availability_lag_minutes` (optional, default 0, non-negative integer) shifts the
# table's timestamps later before the observation window is applied (conservative).
tables:
  vitals:
    file: "clif_vitals"
    availability_col: "recorded_dttm"     # CLIF has no separate vital storetime
    availability: "missing_storetime"
    availability_lag_minutes: 0
    concept_col: "vital_category"        # mCIDE controlled vocab
    value_col: "vital_value"
  labs:
    file: "clif_labs"
    availability_col: "lab_result_dttm"   # result availability; MIMIC storetime maps here
    availability: "result"
    availability_lag_minutes: 0
    concept_col: "lab_category"
    value_col: "lab_value_numeric"
    unit_col: "reference_unit"
  resp_support:                           # INPUT ONLY
    file: "clif_respiratory_support"
    availability_col: "recorded_dttm"
    availability: "missing_storetime"
    availability_lag_minutes: 0
    # Wide table (R8): every numeric setting/observation column is melted to its own
    # event (concept = column name = the physician CSV measurement name), and every
    # categorical column to a fused `column=value` token (KTD4). Nulls emit nothing.
    value_cols: [fio2_set, lpm_set, tidal_volume_set, resp_rate_set, pressure_control_set,
                 pressure_support_set, flow_rate_set, peak_inspiratory_pressure_set,
                 inspiratory_time_set, peep_set, tidal_volume_obs, resp_rate_obs,
                 plateau_pressure_obs, peak_inspiratory_pressure_obs, peep_obs,
                 minute_vent_obs, mean_airway_pressure_obs]
    categorical_value_cols: [device_category, mode_category, tracheostomy]
    input_only: true
  meds:                                   # INPUT ONLY (not a target)
    file: "clif_medication_admin_continuous"
    availability_col: "admin_dttm"
    availability: "recorded"
    availability_lag_minutes: 0
    concept_col: "med_category"          # norepinephrine, propofol, heparin, ...
    value_col: "med_dose"
    unit_col: "med_dose_unit"
    # R6: doses convert to the physician CSV's preferred unit for the med_category
    # (concept = the CSV measurement name, e.g. norepinephrine_mcg_kg_min). Per-kg
    # conversions use the most recent weight available at or before the dose (DuckDB
    # ASOF join on availability time, both tables' lags applied). A dose that cannot be
    # converted keeps its native unit under `{med_category}_{unit}`; the reference site
    # also fits those fallback concepts from its pre-conversion doses (fit-only shadow).
    # Rows whose action is in stop_actions are a dose of 0 (the [0,0] stop bin).
    dose:
      kind: "continuous"
      action_col: "mar_action_category"
      stop_actions: [stop]
      weight_source: {table: vitals, concept: weight_kg}
    input_only: true
  meds_intermittent:                      # INPUT ONLY
    file: "clif_medication_admin_intermittent"
    availability_col: "admin_dttm"
    availability: "recorded"
    availability_lag_minutes: 0
    concept_col: "med_category"
    value_col: "med_dose"
    unit_col: "med_dose_unit"
    # R7: one canonical unit per kind (mass -> mg, units -> u); only `dose` / `mL` (and
    # unrecognised units) fall back to `{med_category}_{unit}`.
    dose:
      kind: "intermittent"
    input_only: true
  assessments:                            # TARGET-ELIGIBLE (R9): measurements, not treatments
    file: "clif_patient_assessments"
    availability_col: "recorded_dttm"
    availability: "missing_storetime"
    availability_lag_minutes: 0
    concept_col: "assessment_category"   # gcs_*, RASS -> rass, braden_*, cam_*, sbt_*
    normalize_concept: true               # lowercase concept names (RASS -> rass)
    value_col: "numerical_value"          # numeric scales -> binned (ordinal for GCS/RASS/Braden)
    categorical_value_col: "categorical_value"   # fused only when there is no numeric value
  crrt:                                   # INPUT ONLY
    file: "clif_crrt_therapy"
    availability_col: "recorded_dttm"
    availability: "missing_storetime"
    availability_lag_minutes: 0
    value_cols: [blood_flow_rate, pre_filter_replacement_fluid_rate,
                 post_filter_replacement_fluid_rate, dialysate_flow_rate, ultrafiltration_out]
    categorical_value_cols: [crrt_mode_category]
    input_only: true
  ecmo:                                   # INPUT ONLY
    file: "clif_ecmo_mcs"
    availability_col: "recorded_dttm"
    availability: "missing_storetime"
    availability_lag_minutes: 0
    # R10: concepts are `{mcs_group}_{column}` (normalized; a missing group -> unknown),
    # so an ECMO pump speed and an LVAD pump speed are different concepts.
    concept_qualifier_col: "mcs_group"
    value_cols: [device_rate, flow, sweep, fdO2]
    categorical_value_cols: [device_category]
    input_only: true
  code_status:                            # INPUT ONLY (R21)
    file: "clif_code_status"
    # Keyed by PATIENT: joined to stays through the hospitalization table. The status in
    # effect at admission (latest start_dttm <= admission) is emitted at admission; each
    # later change within the stay at its start_dttm.
    key: "patient"
    patient_id_col: "patient_id"
    hospitalization_file: "clif_hospitalization"
    admission_col: "admission_dttm"
    discharge_col: "discharge_dttm"
    availability_col: "start_dttm"
    availability: "recorded"
    availability_lag_minutes: 0
    concept: "code_status"                # fused code_status=<category>
    categorical_value_col: "code_status_category"
    emit: "transitions"                   # first status + changes only
    carry_forward: true                   # state in effect at window start is kept
    input_only: true
  position:                               # INPUT ONLY (R21)
    file: "clif_position"
    availability_col: "recorded_dttm"
    availability: "missing_storetime"
    availability_lag_minutes: 0
    concept: "position"                   # fused position=prone|not_prone
    categorical_value_col: "position_category"
    emit: "transitions"
    carry_forward: true
    input_only: true
  adt:
    file: "clif_adt"
    availability_col: "in_dttm"
    availability: "recorded"
    availability_lag_minutes: 0
    concept_col: "location_category"
    value_col: null
    input_only: true

# Static admission tokens (R21, KTD11; BBJ CLIF GEM): emitted once at the stay start,
# before any other event, in this fixed order. `age_decile` bins age_at_admission (years)
# on the CLINICAL AGE BANDS of configs/literature_segments/labs.yaml (<45, 45-54, 55-64,
# 65-74, 75-79, >=80; source `literature`) under the clinical arm; the token keeps its
# historical name because renaming it would break the vocabulary contract. The decile
# arms still bin it by quantiles. The rest are fused categoricals (`sex=female`, ...).
# Input-only, never targets. `static_tokens: []` disables them.
static_tokens: [age_decile, sex, race, ethnicity, admission_type]
static_source:
  hospitalization_file: "clif_hospitalization"   # age_at_admission, admission_type_category
  patient_file: "clif_patient"                   # sex_category, race_category, ethnicity_category

# Full-hospitalization GEM artifact (U8; R17, R18, KTD10). `tokenize_site(...,
# trajectory="hospitalization")` writes gem_events.parquet beside events.parquet with the
# SAME frozen vocab.json (built by the reference site's icu_24h run): window
# [admission_dttm, discharge_dttm], positions = minutes since hospital admission, framed
# `<bos> ADMISSION//<type> <static tokens> ...events... DISCHARGE//<disposition> <eos>`.
# The two allowlists below are appended to the vocabulary at build time (after every
# data-derived token, so data token ids do not move) whether or not the data contains
# them. DISCHARGE//* is the ONLY place disposition appears, at the true discharge_dttm,
# and it is target-eligible; <bos>, ADMISSION//*, static and treatment tokens are inputs.
# Map keys are raw CLIF categories lowercased and stripped; anything unmapped (including
# null/blank) -> `unknown` = end of observation, never read as survival.
gem:
  max_tokens: 8192                         # = configs/model.yaml trunk.max_tokens (test-locked)
  dispositions: [home, facility, hospice, expired, ama, other, unknown]
  disposition_map:
    home: home
    expired: expired
    hospice: hospice
    skilled nursing facility (snf): facility
    acute inpatient rehab facility: facility
    long term care hospital (ltach): facility
    psychiatric hospital: facility
    acute care hospital: facility
    assisted living: facility
    against medical advice (ama): ama
    other: other
    missing: unknown
    unknown: unknown
  admission_types: [ed, elective, direct, transfer, other, unknown]
  admission_map:                           # CLIF admission_type_category (MIMIC: ed/elective/direct)
    ed: ed
    elective: elective
    direct: direct
    osh: transfer
    facility: transfer
    transfer: transfer
    other: other
    missing: unknown
    unknown: unknown

# Target measurement concepts (K hazard heads, ICareFM-style). Treatments excluded.
target_concepts:
  - {name: map,               source: vitals, direction: below, unit: mmHg}
  - {name: lactate,           source: labs,   direction: above, unit: mmol/L}
  - {name: spo2,              source: vitals, direction: below, unit: "%"}
  - {name: respiratory_rate,  source: vitals, direction: above, unit: "breaths per minute"}
  - {name: creatinine,        source: labs,   direction: above, unit: mg/dL}
  - {name: bilirubin_total,   source: labs,   direction: above, unit: mg/dL}
  - {name: platelet_count,    source: labs,   direction: below, unit: "10^3/uL"}
  - {name: heart_rate,        source: vitals, direction: above, unit: "beats per minute"}
  - {name: sbp,               source: vitals, direction: below, unit: mmHg}
  - {name: temp_c,            source: vitals, direction: above, unit: celsius}
  # extend toward K~35 as coverage allows

# CLIF 2.1 already requires these canonical units. Validate before pooling values
# into reference-site bins; do not silently mix site-specific units.
unit_normalization:
  on_mismatch: "error"
  # A `column_units` column with more than this share of its non-null values (after the
  # site's declared conversion) outside its plausible range is refused, with a scale hint.
  max_out_of_range_share: 0.01
  concepts:
    map: mmHg
    lactate: mmol/L
    spo2: "%"
    respiratory_rate: "breaths per minute"
    creatinine: mg/dL
    bilirubin_total: mg/dL
    platelet_count: "10^3/uL"
    heart_rate: "beats per minute"
    sbp: mmHg
    temp_c: celsius

# Unit-less wide-table value columns (CRRT, ECMO/MCS carry no unit column): canonical
# unit and plausible range per `table.column`, from the CLIF 2.1 data dictionary
# (https://clif-icu.com/data-dictionary/data-dictionary-2.1.0, crrt_therapy: blood flow
# mL/min 10-500; replacement / dialysate rates mL/hr 0-10000; ultrafiltration_out "net
# ultrafiltration output (mL/hr)" 0-500) and clifpy's outlier config
# (https://github.com/Common-Longitudinal-ICU-data-Format/clifpy, clifpy/schemas/
# outlier_config.yaml, ecmo_mcs: flow 0.5-10 L/min, sweep 0.5-20 L/min, fdO2 0.21-1.0).
# Values are validated per site AFTER that site's `site_unit_conversions`; more than
# unit_normalization.max_out_of_range_share outside the range is refused, unless the
# column says `on_out_of_range: report`. `flag` is a semantic note carried into every
# tokenization report's data-quality section. The canonical unit becomes the concept's
# reference unit (hashed in vocab.json reference_units with these declarations).
column_units:
  crrt.blood_flow_rate: {unit: mL/min, range: [10, 500]}
  crrt.pre_filter_replacement_fluid_rate: {unit: mL/hr, range: [0, 10000]}
  crrt.post_filter_replacement_fluid_rate: {unit: mL/hr, range: [0, 10000]}
  crrt.dialysate_flow_rate: {unit: mL/hr, range: [0, 10000]}
  # Staged MIMIC median ~352 mL/hr with a p99 near 780: inside or near the plausible
  # range, but high for NET ultrafiltration (the dictionary's own example rows chart
  # 800-1500). Not converted; reported only, pending physician review.
  crrt.ultrafiltration_out:
    unit: mL/hr
    range: [0, 500]
    on_out_of_range: report
    flag: >-
      CLIF defines net ultrafiltration (0-500 mL/hr) but the staged values sit high for
      net removal and may be total effluent; not converted, physician review needed
  ecmo.device_rate: {unit: RPM, range: [0, 15000]}     # pump speed; HeartMate II tops out ~15000 RPM
  ecmo.flow: {unit: L/min, range: [0, 10]}
  ecmo.sweep: {unit: L/min, range: [0, 20]}            # 0 = sweep off (trial off); clifpy floor 0.5 is for running ECMO
  ecmo.fdO2: {unit: fraction, range: [0.21, 1.0]}

# EXPLICIT per-site unit repair (no auto-detection). Keys:
#   table.column                    -> a column_units column: {from, to (= its unit), factor}
#   dose_table.med_category[unit]   -> charted (med, unit) rows: {from, to, factor}
#                                      (factor 1 relabels a mislabeled unit) or
#                                      {from, action: quarantine} (rows keep their native
#                                      `{med}_{unit}` concept, never the converted one)
# canonical value = charted value x factor. Each site declares only its own; the
# reference site's are hashed into the vocabulary, so a vocab built under other repairs
# does not bind. Counts behind each MIMIC entry: aggregate queries of the staged
# MIMIC-IV-Ext-CLIF, 2026-10-03.
site_unit_conversions:
  mimic:
    # blood flow: >99.9% of values above 500; /60 gives p25/p50/p99 120/200/250 mL/min.
    crrt.blood_flow_rate: {from: mL/hr, to: mL/min, factor: 0.016666666666666666}
    # FdO2 charted as percent 21-100 (30,941 values >= 21), but 78 values are already
    # fractions (<= 1): convert only values above 1, so those are not turned into <= 0.01.
    ecmo.fdO2: {from: percent, to: fraction, factor: 0.01, when: {gt: 1.0}}
    # ~300 propofol boluses charted "mcg" with values 10-60: mg doses with a wrong unit.
    meds_intermittent.propofol[mcg]: {from: mcg, to: mg, factor: 1.0,
                                      note: "bolus values 10-60 are mg; charted unit is wrong"}
    # ~400 ketamine rows charted "mcg" with values ~0.1-0.2 (likely mg/kg): true unit
    # unknown, so kept apart as `ketamine_mcg` rather than converted to mg.
    meds_intermittent.ketamine[mcg]: {from: mcg, action: quarantine,
                                      note: "values ~0.2 look weight-based; unit unknown"}

# Plausible running-dose range per converted dose concept (value > 0; 0 is the stop bin),
# checked per site after conversion and corrections. More than max_implausible_share
# outside the range is refused (with a scale hint) unless `on_implausible: report`.
# Upper bounds: clifpy outlier_config.yaml med_dose (propofol 400 mg, midazolam 20 mg,
# fentanyl 500 mcg, hydromorphone 4 mg, lorazepam 10 mg); ketamine 500 mg = 4.5 mg/kg
# induction (label maximum) at ~110 kg. Lower bounds (about a tenth of the smallest usual
# ICU bolus) are NOT from a source: physician sign-off needed.
dose_plausibility:
  max_implausible_share: 0.02
  ranges:
    propofol_mg: {unit: mg, range: [1, 400]}
    midazolam_mg: {unit: mg, range: [0.1, 20]}
    fentanyl_mg: {unit: mg, range: [0.001, 0.5]}
    hydromorphone_mg: {unit: mg, range: [0.05, 4]}
    lorazepam_mg: {unit: mg, range: [0.1, 10]}
    # MIMIC charts ~38% of ketamine "mg" boluses at 0.1-0.3 (weight-based analgesic
    # dosing written as mg?): reported, not refused, pending physician review.
    ketamine_mg: {unit: mg, range: [1, 500], on_implausible: report}

value_binning:
  # PRIMARY SCHEME: physician-designed clinical-segment bins with measurement-density
  # granularity (critical_illness_tokenization_final_with_intervals.csv, 1267 segment rows,
  # 92 measurements across labs, vitals, medications and respiratory support). These bins
  # were designed by CLIF consortium clinicians who defined
  # both the clinical thresholds AND the sub-segment density: tighter intervals in decision
  # zones, wider above/below ranges, and extreme-value quintiles at the tails.
  # THIS is the default — it encodes clinical domain expertise that data-driven binning
  # cannot recover, and it is what differentiates this model from an auto-regressive token
  # predictor on EHR sequences.
  scheme: "clinical_segment"               # {clinical_segment | decile_ablation}; continuous_fused is not a build_edges scheme yet
  segment_source: "external/clifatron/tokenETL/config/critical_illness_tokenization_final_with_intervals.csv"
  n_bins: 10                               # ignored by clinical_segment; used by the decile_ablation arm
  # LITERATURE-GROUNDED SEGMENTS for concepts the physician CSV does not cover: every
  # configs/literature_segments/*.yaml fragment (labs/scores/age, medications, CRRT and
  # ECMO support), each edge tied to a cited source (status literature_proposed: ICU
  # physician sign-off pending). Precedence csv -> literature -> ordinal -> quantile ->
  # single; a CSV concept is never overridden. Clinical arm only (the decile arms take the
  # literature bin count under matched_granularity). Fragments are hashed into vocab.json.
  literature_source: "configs/literature_segments"
  # COVERAGE (U2, R4/KTD3): `all` bins EVERY numeric concept in the reference-site train
  # partition. Source priority per concept: (1) physician CSV segments; (1b) literature
  # fragment edges (above); (2) one point bin
  # per value for integer scales with <= ordinal_max_distinct distinct values (GCS, RASS,
  # Braden); (3) frozen quantile bins (quantile_n_bins target, deduplicated, [a,b),
  # forced edges pinned). Fewer than min_count fitting values -> one bin ("single").
  # The decile arm = coverage all with every source forced to quantile (n_bins target).
  # The per-concept choice is recorded in vocab.json `binning_sources`.
  # `targets_only` restores the pre-v2 behaviour (CSV bins for target_concepts only).
  coverage: "all"                          # {all | targets_only}
  ordinal_max_distinct: 25
  min_count: 20
  quantile_n_bins: 10
  # KTD11 (decile scheme only; the clinical arm ignores both): `matched_granularity` makes
  # each decile concept request the segment count the clinical scheme gives it on the same
  # fit events, filling quantiles lost to ties from the next unused distinct observed
  # values (a concept with too few distinct values keeps the smaller count and is listed
  # in vocab.json provenance.matched_granularity and the tokenization report).
  # `decile_forced_edges` pins `forced_edges` in the decile scheme: false = plain
  # population deciles (global_deciles), true = the forced-edge decile arm.
  matched_granularity: true
  decile_forced_edges: false
  # Dose concepts (any concept charted by these tables, or a table flagged `dose: true`)
  # get a [0,0] stop bin; their quantiles are fit on strictly positive doses only.
  dose_sources: [meds, meds_intermittent]
  build_from_site: "mimic"                 # freeze bin edges on reference site, apply identically everywhere
  fit_partition: "train"                   # never fit vocabulary/edges on validation, calibration, or test
  # SOFT DISCRETIZATION: applied ON TOP of clinical segments to smooth hard bin boundaries
  # while preserving the physician-designed segment edges. Adjacent-bin mass prevents
  # quantization jitter at boundary crossings, especially on dangerous tails.
  soft_discretization: true
  soft_kernel_bins: 1                     # +/- neighbor bins to receive soft mass
  # guaranteed bin edges so tokens are legible at decision points AND boundaries align with the
  # threshold-hazard head's queries. clinical_segment: ADDED to the CSV grid (bin count grows);
  # decile_ablation: REPLACES the nearest quantile edge (n_bins is an upper bound: duplicate
  # quantiles from repeated values are deduplicated, so a concept can end up with fewer bins).
  # Forced edges apply to whichever source bins the concept (ignored for ordinal point bins).
  forced_edges:                           # concept: [physical-value cutpoints guaranteed to be bin boundaries]
    lactate:    [2.0, 4.0]                # Sepsis-3 / Surviving Sepsis
    map:        [65.0]                    # vasopressor trigger
    spo2:       [88.0, 90.0]
    creatinine: [1.5, 2.0, 3.0]           # ~KDIGO stages (verify vs baseline)
    # pao2_fio2 not in target_concepts — add when P/F is available in the data
  # continuous_fused (McCann medRxiv 2026.08.04): -34% seq len, +30% numeric acc, but WORSE calibration
  # than discrete. Calibration is our headline -> ablation arm, not default. Naive unfused xVal collapses
  # to the median (Lee) -> never use unfused.

notes:
  enabled: false                          # turn on for multimodal branch
  file: "clif_notes"                      # site-specific; VERIFY name + timestamp col
  time_col: "note_dttm"
  text_col: "note_text"
  leakage_guard: "note_dttm <= anchor + obs_hours"   # pre-anchor notes only (rule 3)
  encoder: "thomas-sounack/BioClinical-ModernBERT-base"  # frozen; MEMORY.md multimodal decision = NotesEncoder default (test-locked)
