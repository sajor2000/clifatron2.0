# The ONE registry of thresholds (KTD3). Every entry is (target concept, threshold value,
# direction); labels are always computed at the exact value. The model sees a threshold as
# (concept, value-bin index under the arm's own segments, direction) — the mapping is
# `src/data/threshold_grid.py`, bound to the vocabulary hash. Read by the in-stream target
# builder (U3), the experiment matrix (U6) and the claims evaluation panel (U8).
#
# NEEDS PHYSICIAN CONFIRMATION BEFORE THE FIRST REAL TRAINING RUN: every
# `competing_risk_cause` entry with `status: proposed` is a default chosen by the engineers,
# not a signed outcome definition. `status: contract` entries repeat the threshold the
# `outcomes` block of configs/cohort.yaml already fixes (that block is hash-bound and is
# not edited here).
#
# Direction is strict, as in the 24 h outcome contract: `below` is value < threshold,
# `above` is value > threshold. A value equal to the threshold is not an event.

schema_version: "1.0.0"

# How an anchor on the full-hospitalization stream is labelled (KTD1). The lookback and
# the ascertainment window are the 24 h outcome contract's own values
# (configs/cohort.yaml outcomes.*.baseline_lookback_hours and
# .required_measurement_within_hours_of_horizon).
label_rule:
  horizon_hours: 48
  # prevalent: the last value of the concept in [anchor - lookback, anchor] is already
  # beyond the threshold.
  baseline_lookback_hours: 6
  # A horizon that elapses with no crossing is `negative` only if the concept is measured
  # within this many hours before the horizon end; otherwise `not_ascertainable`.
  required_measurement_within_hours_of_horizon: 12

# Claim 1, on-edge: each equals a `value_binning.forced_edges` entry in configs/data.yaml
# (test-locked), so it is a bin boundary in the clinical arm and in the forced-edge
# decile arm.
decision:
  - {concept: lactate,    value: 2.0,  direction: above}   # mmol/L
  - {concept: lactate,    value: 4.0,  direction: above}
  - {concept: map,        value: 65.0, direction: below}   # mmHg
  - {concept: spo2,       value: 88.0, direction: below}   # %
  - {concept: spo2,       value: 90.0, direction: below}
  - {concept: creatinine, value: 1.5,  direction: above}   # mg/dL
  - {concept: creatinine, value: 2.0,  direction: above}
  - {concept: creatinine, value: 3.0,  direction: above}

# Claim 1, off-edge: CANDIDATES. Each is strictly inside a physician segment (test-locked
# against the segment CSV) and is paired with a decision threshold of the same concept.
# Whether a candidate is also off-edge in the decile arms depends on the data: the
# edge-distance table (`threshold_grid.edge_distance`) decides, per frozen vocabulary,
# before any training. A control is registered for a claim only where it is off-edge in
# every arm.
control:
  - {concept: lactate,    value: 2.5,  direction: above, paired_decision: 2.0, status: candidate}  # inside (2.2, 2.7]
  - {concept: lactate,    value: 3.0,  direction: above, paired_decision: 4.0, status: candidate}  # inside (2.7, 3.4]
  - {concept: map,        value: 63.0, direction: below, paired_decision: 65.0, status: candidate} # inside (61, 65); 60 and 61 are edges
  - {concept: spo2,       value: 85.0, direction: below, paired_decision: 88.0, status: candidate} # inside [49.9, 88)
  - {concept: spo2,       value: 89.0, direction: below, paired_decision: 90.0, status: candidate} # inside [88, 90)
  - {concept: creatinine, value: 1.3,  direction: above, paired_decision: 1.5, status: candidate}  # inside (1.2, 1.42]
  - {concept: creatinine, value: 2.3,  direction: above, paired_decision: 2.0, status: candidate}  # inside (2, 2.63]
  - {concept: creatinine, value: 3.5,  direction: above, paired_decision: 3.0, status: candidate}  # inside (3, 4.87]

# The competing-risk head's cause for each target concept: exactly one threshold per entry
# of `target_concepts` in configs/data.yaml (test-locked). The head's last cause slot is
# death (`DISCHARGE//expired`).
competing_risk_cause:
  - {concept: map,              value: 65.0,  direction: below, status: contract}   # cohort.yaml map_below_65_48h
  - {concept: lactate,          value: 4.0,   direction: above, status: contract}   # cohort.yaml lactate_above_4_48h
  - {concept: spo2,             value: 88.0,  direction: below, status: contract}   # cohort.yaml spo2_below_88_48h
  - {concept: respiratory_rate, value: 24.0,  direction: above, status: proposed}   # NEWS2 red score: >= 25 breaths/min
  - {concept: creatinine,       value: 2.0,   direction: above, status: proposed}   # SOFA renal >= 2 (2.0 mg/dL); a forced edge
  - {concept: bilirubin_total,  value: 2.0,   direction: above, status: proposed}   # SOFA liver >= 2 (2.0 mg/dL)
  - {concept: platelet_count,   value: 100.0, direction: below, status: proposed}   # SOFA coagulation >= 2 (< 100 x10^3/uL)
  - {concept: heart_rate,       value: 130.0, direction: above, status: proposed}   # NEWS2 red score: >= 131 beats/min
  - {concept: sbp,              value: 90.0,  direction: below, status: proposed}   # hypotension, SBP < 90 mmHg
  - {concept: temp_c,           value: 38.3,  direction: above, status: proposed}   # fever, > 38.3 C (SCCM/IDSA)
